name: Shopliminal - Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Prepare iOS project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ] || [ ! -f ios/Runner/Info.plist ]; then
            flutter create \
              --platforms=ios \
              --org com.shopliminal \
              --project-name shopliminal \
              .
          fi

      - name: Configure app identity and deployment target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          content = path.read_text()
          content = re.sub(r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;", "PRODUCT_BUNDLE_IDENTIFIER = com.shopliminal.ios;", content)
          content = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;", "IPHONEOS_DEPLOYMENT_TARGET = 15.0;", content)
          path.write_text(content)
          PY

      - name: Install dependencies & Build iOS
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          flutter build ios --release --no-codesign --verbose

      - name: Package unsigned IPA with Dylib Inject
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          rm -rf Payload Shopliminal.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app

          # Nhúng file dylib nếu có sẵn trong thư mục gốc vào App Bundle
          if [ -f "shopliminal.dylib" ]; then
            cp shopliminal.dylib Payload/Runner.app/
            echo "Đã nhúng thư viện shopliminal.dylib vào App Bundle."
          fi

          /usr/bin/zip -qry Shopliminal.ipa Payload
          test -s Shopliminal.ipa
          ls -lh Shopliminal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SHOPLIMINAL-IOS-IPA
          path: Shopliminal.ipa
          if-no-files-found: error
          retention-days: 7
